name: Genoa
options:
  bundleIdPrefix: com.talkgenoa
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  Genoa:
    type: application
    platform: iOS
    sources: [Genoa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talkgenoa.ios
        INFOPLIST_FILE: Genoa/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Genoa/Resources/Genoa.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
  GenoaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GenoaTests]
    dependencies: [{target: Genoa}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GenoaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GenoaUITests]
    dependencies: [{target: Genoa}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Genoa:
    build:
      targets:
        Genoa: all
    test:
      targets: [GenoaTests, GenoaUITests]
