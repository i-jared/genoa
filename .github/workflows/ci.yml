name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      # The integration suites run against a disposable local Worker, D1 and R2.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" > .dev.vars
      - run: npm run migrate:local
      - name: Start local Worker
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/health && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      - run: npm test
      - if: failure()
        run: cat wrangler.log

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests on a simulator
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          xcodebuild -project ios/Genoa.xcodeproj -scheme Genoa \
            -destination "platform=iOS Simulator,name=$device" \
            -only-testing:GenoaTests CODE_SIGNING_ALLOWED=NO test
